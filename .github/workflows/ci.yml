name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  # Fast, deterministic, no network. docs/testing-strategy.md section 8.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Slower, real model and database calls. Gated on secrets being present, so a
  # fork without them reports skipped rather than a misleading pass.
  eval:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Verify the judge detects what it claims to
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
        run: node --experimental-strip-types eval/harness/calibrate.ts
      # NFR-P3-01. The only test that proves the policies exist, and it needs a
      # real database, so it runs here rather than in the offline job.
      - name: Row-level security
        env:
          DATABASE_APP_URL: ${{ secrets.DATABASE_APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --experimental-strip-types scripts/rls-check.ts
      # Exits non-zero when faithfulness < 0.90, any answer carries an uncited
      # factual claim, or the refusal rate exceeds 35%. NFR-QUAL-01..03.
      - name: Golden set eval
        env:
          DATABASE_APP_URL: ${{ secrets.DATABASE_APP_URL }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
        run: node --experimental-strip-types eval/harness/run.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/
